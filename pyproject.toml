[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-probability"
version = "1.0.0"
description = "Reproducible customer churn probability demo with Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shlok Bhutani" }]
dependencies = [
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<2.5",
  "pandas>=2.3,<4",
  "protobuf>=6.33,<8",
  "scikit-learn>=1.8,<2",
  "streamlit>=1.54,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
